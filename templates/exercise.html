{% load static %}
<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕاهێنان - Zagros Academy</title>
    <link rel="stylesheet" href="{% static 'css/exercise.css' %}?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="e-nav">
        <a href="/practice/" title="گەڕانەوە">⟶</a>
        <span class="mid">✍️ ڕاهێنان: <b id="e-course-name"></b></span>
        <div style="display:flex;gap:10px;align-items:center;">
            <button class="theme-btn" id="theme-btn" title="گۆڕینی ڕووناکی/تاریکی">🌙</button>
            <a href="/" title="سەرەکی">🏠</a>
        </div>
    </nav>

    <!-- lesson tabs -->
    <div class="e-tabs" id="e-tabs"></div>

    <!-- run bar -->
    <div class="e-runbar">
        <button class="e-run" id="e-run">Run ▶</button>
    </div>

    <!-- question/prompt box -->
    <div class="e-prompt-box" id="e-prompt"></div>

    <!-- split: editor + output -->
    <div class="e-split">
        <textarea class="e-editor" id="e-editor" spellcheck="false"></textarea>
        <div class="e-output" id="e-output">ئەنجام لێرە دەردەکەوێت...</div>
    </div>

    <script src="{% static 'js/exercise.js' %}?v=8"></script>
</body>

</html>
