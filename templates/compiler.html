<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Code Compiler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 100vh;
        }
        
        .editor-section,
        .output-section {
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .section-header {
            background: #2d2d2d;
            padding: 15px;
            border-bottom: 2px solid #007bff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-header h2 {
            font-size: 18px;
            margin: 0;
        }
        
        .run-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .run-btn:hover {
            background: #218838;
        }
        
        .run-btn:active {
            transform: scale(0.98);
        }
        
        textarea {
            flex: 1;
            background: #1e1e1e;
            color: #00ff00;
            border: none;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        
        textarea::placeholder {
            color: #666;
        }
        
        .output {
            flex: 1;
            background: #0d0d0d;
            color: #00ff00;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .error {
            color: #ff6b6b;
        }
        
        .success {
            color: #51cf66;
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #ffc107;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Editor Section -->
        <div class="editor-section">
            <div class="section-header">
                <h2>📝 Python Code</h2>
                <button class="run-btn" onclick="runCode()">▶ Run Code</button>
            </div>
            <textarea id="codeInput" placeholder="Write your Python code here...
# Example:
print('Hello, World!')
name = input('Enter your name: ')
print(f'Hi {name}!')"></textarea>
        </div>

        <!-- Output Section -->
        <div class="output-section">
            <div class="section-header">
                <h2>📤 Output</h2>
            </div>
            <div class="output" id="output">Click "Run Code" to see output...</div>
        </div>
    </div>

    <script>
        function runCode() {
            const code = document.getElementById('codeInput').value;
            const outputDiv = document.getElementById('output');

            if (!code.trim()) {
                outputDiv.innerHTML = '<span class="error">❌ Please write some code first!</span>';
                return;
            }

            outputDiv.innerHTML = '<span class="loading">⏳ Running code...</span>';

            // Send code to backend for execution
            fetch('/api/run-code/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        code: code
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        outputDiv.innerHTML = `<span class="success">${data.output || '✓ Code ran successfully (no output)'}</span>`;
                    } else {
                        outputDiv.innerHTML = `<span class="error">❌ Error:\n${data.error}</span>`;
                    }
                })
                .catch(error => {
                    outputDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                });
        }

        // Get CSRF token from cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Allow Ctrl+Enter to run code
        document.getElementById('codeInput').addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'Enter') {
                runCode();
            }
        });
    </script>
</body>

</html>
